{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <title>Home</title>
    <style>
        body {
            display: flex;
            justify-content: center;   /* по центру по горизонтали */
            align-items: center;       /* по центру по вертикали */
            min-height: 100vh;         /* высота экрана */
            margin: 0;
            flex-direction: column;    /* элементы идут сверху вниз */
        }
        .posts {
            text-decoration: none;
            color: #000000f6;
            font-weight: 600;
            transition: all 0.2s ease;
            padding: 12px;
            border: 1px solid black;
            border-radius: 6px;
        }
        .posts:hover {
            background-color: rgb(150, 150, 150);
            color: #ffffff;
            border: 1px solid rgb(69, 0, 0);
            transform: scale(1.05); /* лёгкое увеличение при наведении */
        }
        .containerPosts {
       
            padding: 18px;
            border-radius: 12px;
            color: #000000;
            text-align: center;
            text-shadow: 0 4px 16px rgba(0,0,0,0.56);
        }
    </style>
</head>
<body>
    <div class="containerPosts">
        <h1>Welcome to Django Framework!</h1>
    </div>
    <br>
    <a class="posts" href="{% url 'posts' %}">View posts</a>
</body>
</html>
