{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Form post</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            background-image: url("https://t3.ftcdn.net/jpg/02/91/71/96/240_F_291719619_lyQS5pyFo3Wj43hy83o3R0oOxhaep9fQ.jpg");
            background-attachment: fixed;
            background-repeat: no-repeat;
            width: 100%;
            background-size: cover;
        }
        h1 {
            color: #ffffff;
        }
        .post_form input {
            color: rgb(255, 255, 255);
            width: 600px;
            border-radius: 6px;
            padding: 6px;
            outline: none;
            font-size: 18px;
            background-color: rgb(90, 90, 90);
            border: 1px solid rgb(120, 0, 0);
            margin: 13px;

        }
        .post_form textarea {
            color: rgb(255, 255, 255);
            width: 600px;
            height: 30px;
            border-radius: 6px;
            padding: 6px;
            outline: none;
            font-size: 18px;
            background-color: rgb(90, 90, 90);
            border: 1px solid rgb(120, 0, 0);
            margin: 13px;
        }
        .container-form {
            background-color: rgba(68, 68, 68, 0.885);
            border-radius: 12px;
            padding: 20px;
            width: 80%;
        }
        .container-form p {
            color: aliceblue;
            text-align: center;
            font-weight: 700;
        }
        .button-back {
            background-color: rgb(15, 124, 233);
            text-decoration: none;
            color: #ffffff;
            border: none;
            transition: all 0.2s ease;
            padding: 7px;
            border-radius: 6px;

        }
        .button-back:hover {
            background-color: rgb(2, 101, 200);
        }
    </style>
</head>
<body>
    <h1>New Post</h1>
    <div class="container-form">
        <form method="POST" class="post_form">{% csrf_token %}
            {{ form.as_p }}
            <!-- ФОРМА ДОЛЖНА ОТПРАВЛЯТЬСЯ ЧЕРЕЗ КНОПКУ -->
            <button type="submit" class="btn btn-primary">Save</button>
            <a class="button-back" href="{% url 'posts' %}">Back</a>
        </form>
    </div>
</body>
</html>
